name: Deploy wedding invitation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare site
        run: |
          git clone --depth 1 https://github.com/tutouxiaozhou/stardew-wedding-template.git _template
          rm -rf site
          mkdir site
          cp -a _template/. site/
          cp index.html style.css app.js site/
          mkdir -p site/assets/wedding
          cp assets/wedding/wedding-mark.svg site/assets/wedding/wedding-mark.svg
          touch site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
