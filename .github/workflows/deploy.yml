name: Deploy wedding invitation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout wedding customization
        uses: actions/checkout@v4

      - name: Prepare full Stardew template
        run: |
          git clone --depth 1 https://github.com/tutouxiaozhou/stardew-wedding-template.git _template
          rm -rf site
          mkdir site
          cp -a _template/. site/
          cp index.html site/index.html
          mkdir -p site/assets
          cp assets/pixel-couple.svg site/assets/pixel-couple.svg
          cp assets/share-cover.svg site/assets/share-cover.svg
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
